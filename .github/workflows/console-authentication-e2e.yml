name: Console authentication product acceptance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-authentication:
    name: JDK 17, Fresh Compose and trusted TLS (Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Chromium 的视觉基线目前是 macOS；Linux CI 的核心认证行为仍须全部执行。
      SF_VISUAL_SNAPSHOTS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Protect published v1 contract baselines
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            exit 0
          fi
          changes="$(git diff --name-status "$BASE_SHA" "$GITHUB_SHA" -- contracts/compatibility-baselines/v1)"
          if [[ -n "$(printf '%s\n' "$changes" | awk '$1 !~ /^A/')" ]]; then
            echo "已发布 v1 契约基线不可修改或删除；仅允许新增快照目录。" >&2
            printf '%s\n' "$changes" >&2
            exit 1
          fi
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "新增 v1 契约基线目录必须使用待发布 Git tag: $tag" >&2
              exit 1
            fi
            baseline="contracts/compatibility-baselines/v1/$tag"
            diff -u contracts/openapi/v1.yaml "$baseline/openapi/v1.yaml"
            diff -u contracts/openapi/common.yaml "$baseline/openapi/common.yaml"
            diff -u \
              <(find contracts/protobuf -path '*/v1/*.proto' -type f | sed 's#^contracts/protobuf/##' | sort) \
              <(find "$baseline/protobuf" -type f -name '*.proto' | sed "s#^$baseline/protobuf/##" | sort)
            while IFS= read -r proto; do
              diff -u "contracts/protobuf/$proto" "$baseline/protobuf/$proto"
            done < <(find contracts/protobuf -path '*/v1/*.proto' -type f | sed 's#^contracts/protobuf/##' | sort)
            diff -u \
              <(find contracts/events -type f -name '*.v1.schema.json' | sed 's#^contracts/events/##' | sort) \
              <(find "$baseline/events" -type f -name '*.v1.schema.json' | sed "s#^$baseline/events/##" | sort)
            while IFS= read -r schema; do
              diff -u "contracts/events/$schema" "$baseline/events/$schema"
            done < <(find contracts/events -type f -name '*.v1.schema.json' | sed 's#^contracts/events/##' | sort)
          done < <(git diff --name-only --diff-filter=A "$BASE_SHA" "$GITHUB_SHA" -- contracts/compatibility-baselines/v1 \
            | awk -F/ 'NF >= 5 {print $4}' | sort -u)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: "24.14.1"
      - run: corepack enable
      - name: Install locked workspace dependencies
        working-directory: consoles
        run: pnpm install --frozen-lockfile
      - name: Install Chromium test runtime and Chrome product browser
        working-directory: consoles
        run: pnpm exec playwright install --with-deps chromium chrome
      - name: Verify scoped verification entry points
        run: node --test --test-concurrency=1 scripts/test/scoped-frontend-verification.test.mjs scripts/test/backend-verification-profile.test.mjs scripts/test/console-acceptance-prerequisites.test.mjs scripts/test/tenant-revocation-probe.test.mjs
      # 同一 checkout 的完整构建只执行一次，随后复用其制品；失败会阻止后续产品验收。
      - name: Verify JDK 17 and build all acceptance prerequisites
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Configure the product acceptance scope
        run: |
          {
            echo 'SF_ACCEPTANCE_TARGET=ci'
            echo "SF_BRAND_EVIDENCE_DIRECTORY=$GITHUB_WORKSPACE/.scratch/issue-159-ci"
            # 产品/TLS 根域仅作用于此阶段，不改变通用构建夹具。
            echo 'SF_ACCEPTANCE_ROOT_DOMAIN=saasforge.example.com'
          } >> "$GITHUB_ENV"
      - name: Configure ephemeral trusted TLS and controlled Origins
        working-directory: consoles
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tls_directory="$RUNNER_TEMP/console-authentication-tls"
          mkdir -p "$tls_directory"
          openssl req -x509 -newkey rsa:3072 -nodes -days 2 -sha256 \
            -keyout "$tls_directory/root-ca.key" -out "$tls_directory/root-ca.pem" \
            -subj '/CN=SaaS Forge CI Acceptance CA' \
            -addext 'basicConstraints=critical,CA:TRUE,pathlen:0' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' \
            -addext 'nameConstraints=critical,permitted;DNS:.saasforge.example.com'
          openssl req -new -newkey rsa:3072 -nodes -sha256 \
            -keyout "$tls_directory/server.key" -out "$tls_directory/server.csr" \
            -subj '/CN=platform.saasforge.example.com'
          cat > "$tls_directory/server.ext" <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:platform.saasforge.example.com,DNS:console.saasforge.example.com,DNS:api.saasforge.example.com,DNS:remote.saasforge.example.com
          EOF
          openssl x509 -req -in "$tls_directory/server.csr" \
            -CA "$tls_directory/root-ca.pem" -CAkey "$tls_directory/root-ca.key" \
            -CAcreateserial -days 1 -sha256 -extfile "$tls_directory/server.ext" \
            -out "$tls_directory/server.pem"
          sudo install -m 644 "$tls_directory/root-ca.pem" /usr/local/share/ca-certificates/saas-forge-acceptance.crt
          sudo update-ca-certificates
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          # Chrome 版本间 NSS 默认路径可能不同；保留两个信任存储。
          for nss_directory in "$HOME/.pki/nssdb" "$HOME/.local/share/pki/nssdb"; do
            mkdir -p "$nss_directory"
            if [[ ! -f "$nss_directory/cert9.db" ]]; then
              certutil -N --empty-password -d "sql:$nss_directory"
            fi
            certutil -A -d "sql:$nss_directory" -n 'SaaS Forge CI Acceptance CA' \
              -t 'C,,' -i "$tls_directory/root-ca.pem"
          done
          printf '\n127.0.0.1 platform.saasforge.example.com console.saasforge.example.com api.saasforge.example.com remote.saasforge.example.com\n' | sudo tee -a /etc/hosts >/dev/null
          {
            printf 'SF_ACCEPTANCE_TLS_CERT=%s\n' "$tls_directory/server.pem"
            printf 'SF_ACCEPTANCE_TLS_KEY=%s\n' "$tls_directory/server.key"
            printf 'NODE_EXTRA_CA_CERTS=%s\n' "$tls_directory/root-ca.pem"
          } >> "$GITHUB_ENV"
      - name: Verify actual Console product paths through fresh services
        run: bash scripts/verify-console-authentication-e2e.sh --product
      - name: Preserve sanitized browser and gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-domain-browser-evidence-${{ github.sha }}
          if-no-files-found: error
          path: |
            .scratch/issue-159-ci/acceptance-run.json
            .scratch/issue-159-ci/static-remote-*.json
            .scratch/issue-159-ci/session-security-*/browser-sessions.json
      - name: Remove ephemeral certificate material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/console-authentication-tls"
