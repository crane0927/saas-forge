name: saas-forge-platform-console
services:
  platform-console:
    image: node:24.14.1-alpine
    # Linux bind mount 保留构建者权限；以该 UID 只读消费工件，不依赖 Docker Desktop 的权限映射。
    user: "${CONSOLE_UID:-1000}:${CONSOLE_GID:-1000}"
    read_only: true
    command: ["node", "/app/serve.mjs"]
    environment:
      SF_ACCEPTANCE_ROOT_DOMAIN: ${SF_ACCEPTANCE_ROOT_DOMAIN:-saas.forge.test}
      SF_REMOTE_STATIC_MODULE: /app/remote-static.mjs
    volumes:
      - ../../deploy/docker/console-serve.mjs:/app/serve.mjs:ro
      - ../../deploy/compose/local-https-development/remote-static.mjs:/app/remote-static.mjs:ro
      - ../../deploy/compose/local-https-development/browser-security-evidence.mjs:/app/browser-security-evidence.mjs:ro
      - ./dist:/app/dist:ro

networks:
  default:
    external: true
    name: ${SF_DOCKER_NETWORK:-compose_default}
