syntax = "proto3";

package io.saasforge.contracts.iam.passwordsetup.v1;

option java_multiple_files = true;
option java_package = "io.saasforge.contracts.iam.passwordsetup.v1";

// IAM 按权威 Identity 邮箱投递一次性 Password Setup 邮件。
service PasswordSetupService {
  // Read-only; uses the same reserved Tenant Access client authorization.
  rpc GetPasswordSetupNotification(GetPasswordSetupNotificationRequest) returns (GetPasswordSetupNotificationResponse);
  rpc DeliverPasswordSetup(DeliverPasswordSetupRequest) returns (DeliverPasswordSetupResponse);
}

message DeliverPasswordSetupRequest {
  // 调用方为一次投递工作项生成并在重试中保持不变的规范 UUIDv7。
  string request_id = 1;
  string identity_id = 2;
}

message DeliverPasswordSetupResponse {
  PasswordSetupDeliveryResult result = 1;
}

enum PasswordSetupDeliveryResult {
  PASSWORD_SETUP_DELIVERY_RESULT_UNSPECIFIED = 0;
  DELIVERED = 1;
  PASSWORD_READY = 2;
}

message GetPasswordSetupNotificationRequest {
  string request_id = 1;
  string identity_id = 2;
}

message GetPasswordSetupNotificationResponse {
  PasswordSetupNotificationState state = 1;
}

enum PasswordSetupNotificationState {
  PASSWORD_SETUP_NOTIFICATION_STATE_UNSPECIFIED = 0;
  NOT_REQUESTED = 1;
  PENDING = 2;
  MAIL_SERVICE_ACCEPTED = 3;
  PASSWORD_ALREADY_READY = 4;
  RECOVERY_REQUIRED = 5;
}
