services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: saasforge
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      IAM_MIGRATOR_PASSWORD: ${IAM_MIGRATOR_PASSWORD:?IAM_MIGRATOR_PASSWORD is required}
      IAM_APP_PASSWORD: ${IAM_APP_PASSWORD:?IAM_APP_PASSWORD is required}
      TENANT_ACCESS_MIGRATOR_PASSWORD: ${TENANT_ACCESS_MIGRATOR_PASSWORD:?TENANT_ACCESS_MIGRATOR_PASSWORD is required}
      TENANT_ACCESS_APP_PASSWORD: ${TENANT_ACCESS_APP_PASSWORD:?TENANT_ACCESS_APP_PASSWORD is required}
      ENTITLEMENT_MIGRATOR_PASSWORD: ${ENTITLEMENT_MIGRATOR_PASSWORD:?ENTITLEMENT_MIGRATOR_PASSWORD is required}
      ENTITLEMENT_APP_PASSWORD: ${ENTITLEMENT_APP_PASSWORD:?ENTITLEMENT_APP_PASSWORD is required}
      AUDIT_MIGRATOR_PASSWORD: ${AUDIT_MIGRATOR_PASSWORD:?AUDIT_MIGRATOR_PASSWORD is required}
      AUDIT_APP_PASSWORD: ${AUDIT_APP_PASSWORD:?AUDIT_APP_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../postgresql/bootstrap.sh:/docker-entrypoint-initdb.d/01-bootstrap.sh:ro

  redis:
    image: redis:8.8.1
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - kafka-data:/var/lib/kafka/data

  otel-collector:
    image: otel/opentelemetry-collector:0.119.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro

  nacos:
    image: nacos/nacos-server:v3.1.1
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_ADMIN_ENABLE: "true"
      NACOS_AUTH_CONSOLE_ENABLE: "true"
      NACOS_AUTH_SYSTEM_TYPE: nacos
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?NACOS_AUTH_IDENTITY_KEY is required}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?NACOS_AUTH_IDENTITY_VALUE is required}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN is required}
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:8849:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8848/nacos/v1/ns/operator/metrics >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  nacos-init:
    image: curlimages/curl:8.12.1
    entrypoint: ["/bin/sh", "/scripts/nacos-init.sh"]
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      NACOS_BOOTSTRAP_PASSWORD: ${NACOS_BOOTSTRAP_PASSWORD:?NACOS_BOOTSTRAP_PASSWORD is required}
      NACOS_NAMESPACE: dev
      NACOS_PUBLISH_USERNAME: ${NACOS_PUBLISH_USERNAME:?NACOS_PUBLISH_USERNAME is required}
      NACOS_PUBLISH_PASSWORD: ${NACOS_PUBLISH_PASSWORD:?NACOS_PUBLISH_PASSWORD is required}
      NACOS_IAM_USERNAME: ${NACOS_IAM_USERNAME:?NACOS_IAM_USERNAME is required}
      NACOS_IAM_PASSWORD: ${NACOS_IAM_PASSWORD:?NACOS_IAM_PASSWORD is required}
      NACOS_TENANT_ACCESS_USERNAME: ${NACOS_TENANT_ACCESS_USERNAME:?NACOS_TENANT_ACCESS_USERNAME is required}
      NACOS_TENANT_ACCESS_PASSWORD: ${NACOS_TENANT_ACCESS_PASSWORD:?NACOS_TENANT_ACCESS_PASSWORD is required}
      NACOS_ENTITLEMENT_USERNAME: ${NACOS_ENTITLEMENT_USERNAME:?NACOS_ENTITLEMENT_USERNAME is required}
      NACOS_ENTITLEMENT_PASSWORD: ${NACOS_ENTITLEMENT_PASSWORD:?NACOS_ENTITLEMENT_PASSWORD is required}
      NACOS_AUDIT_USERNAME: ${NACOS_AUDIT_USERNAME:?NACOS_AUDIT_USERNAME is required}
      NACOS_AUDIT_PASSWORD: ${NACOS_AUDIT_PASSWORD:?NACOS_AUDIT_PASSWORD is required}
      NACOS_GATEWAY_USERNAME: ${NACOS_GATEWAY_USERNAME:?NACOS_GATEWAY_USERNAME is required}
      NACOS_GATEWAY_PASSWORD: ${NACOS_GATEWAY_PASSWORD:?NACOS_GATEWAY_PASSWORD is required}
    volumes:
      - ./nacos-init.sh:/scripts/nacos-init.sh:ro
      - ../nacos/dev/iam-service.yaml:/config/iam-service.yaml:ro
      - ../nacos/dev/tenant-access-service.yaml:/config/tenant-access-service.yaml:ro
      - ../nacos/dev/entitlement-service.yaml:/config/entitlement-service.yaml:ro
      - ../nacos/dev/audit-service.yaml:/config/audit-service.yaml:ro
      - ../nacos/dev/gateway.yaml:/config/gateway.yaml:ro

  iam-migrate:
    image: flyway/flyway:12
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/iam_db
      FLYWAY_USER: iam_migrator
      FLYWAY_PASSWORD: ${IAM_MIGRATOR_PASSWORD:?IAM_MIGRATOR_PASSWORD is required}
      FLYWAY_CONNECT_RETRIES: 30
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    command: migrate
    volumes:
      - ../../services/iam-service/src/main/resources/db/migration:/flyway/sql:ro

  tenant-access-migrate:
    image: flyway/flyway:12
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/tenant_access_db
      FLYWAY_USER: tenant_access_migrator
      FLYWAY_PASSWORD: ${TENANT_ACCESS_MIGRATOR_PASSWORD:?TENANT_ACCESS_MIGRATOR_PASSWORD is required}
      FLYWAY_CONNECT_RETRIES: 30
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    command: migrate
    volumes:
      - ../../services/tenant-access-service/src/main/resources/db/migration:/flyway/sql:ro

  entitlement-migrate:
    image: flyway/flyway:12
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/entitlement_db
      FLYWAY_USER: entitlement_migrator
      FLYWAY_PASSWORD: ${ENTITLEMENT_MIGRATOR_PASSWORD:?ENTITLEMENT_MIGRATOR_PASSWORD is required}
      FLYWAY_CONNECT_RETRIES: 30
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    command: migrate
    volumes:
      - ../../services/entitlement-service/src/main/resources/db/migration:/flyway/sql:ro

  audit-migrate:
    image: flyway/flyway:12
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/audit_db
      FLYWAY_USER: audit_migrator
      FLYWAY_PASSWORD: ${AUDIT_MIGRATOR_PASSWORD:?AUDIT_MIGRATOR_PASSWORD is required}
      FLYWAY_CONNECT_RETRIES: 30
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    command: migrate
    volumes:
      - ../../services/audit-service/src/main/resources/db/migration:/flyway/sql:ro

  iam-service:
    image: saasforge/iam-service:local
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        MODULE: services/iam-service
    depends_on:
      iam-migrate:
        condition: service_completed_successfully
      nacos-init:
        condition: service_completed_successfully
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: dev
      NACOS_IAM_USERNAME: ${NACOS_IAM_USERNAME:?NACOS_IAM_USERNAME is required}
      NACOS_IAM_PASSWORD: ${NACOS_IAM_PASSWORD:?NACOS_IAM_PASSWORD is required}
    ports:
      - "127.0.0.1:8081:8080"

  tenant-access-service:
    image: saasforge/tenant-access-service:local
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        MODULE: services/tenant-access-service
    depends_on:
      tenant-access-migrate:
        condition: service_completed_successfully
      nacos-init:
        condition: service_completed_successfully
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: dev
      NACOS_TENANT_ACCESS_USERNAME: ${NACOS_TENANT_ACCESS_USERNAME:?NACOS_TENANT_ACCESS_USERNAME is required}
      NACOS_TENANT_ACCESS_PASSWORD: ${NACOS_TENANT_ACCESS_PASSWORD:?NACOS_TENANT_ACCESS_PASSWORD is required}
    ports:
      - "127.0.0.1:8082:8080"

  entitlement-service:
    image: saasforge/entitlement-service:local
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        MODULE: services/entitlement-service
    depends_on:
      entitlement-migrate:
        condition: service_completed_successfully
      nacos-init:
        condition: service_completed_successfully
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: dev
      NACOS_ENTITLEMENT_USERNAME: ${NACOS_ENTITLEMENT_USERNAME:?NACOS_ENTITLEMENT_USERNAME is required}
      NACOS_ENTITLEMENT_PASSWORD: ${NACOS_ENTITLEMENT_PASSWORD:?NACOS_ENTITLEMENT_PASSWORD is required}
    ports:
      - "127.0.0.1:8083:8080"

  audit-service:
    image: saasforge/audit-service:local
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        MODULE: services/audit-service
    depends_on:
      audit-migrate:
        condition: service_completed_successfully
      nacos-init:
        condition: service_completed_successfully
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: dev
      NACOS_AUDIT_USERNAME: ${NACOS_AUDIT_USERNAME:?NACOS_AUDIT_USERNAME is required}
      NACOS_AUDIT_PASSWORD: ${NACOS_AUDIT_PASSWORD:?NACOS_AUDIT_PASSWORD is required}
    ports:
      - "127.0.0.1:8084:8080"

  gateway:
    image: saasforge/gateway:local
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        MODULE: gateway
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: dev
      NACOS_GATEWAY_USERNAME: ${NACOS_GATEWAY_USERNAME:?NACOS_GATEWAY_USERNAME is required}
      NACOS_GATEWAY_PASSWORD: ${NACOS_GATEWAY_PASSWORD:?NACOS_GATEWAY_PASSWORD is required}
    depends_on:
      nacos-init:
        condition: service_completed_successfully
      iam-service:
        condition: service_started
      tenant-access-service:
        condition: service_started
      entitlement-service:
        condition: service_started
      audit-service:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
  redis-data:
  kafka-data:
