# 此文件与 compose.yaml 合并，所有数据卷、网络及应用镜像均归属于本次验收项目。
services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  kafka:
    ports: !reset []
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
  mailpit:
    ports: !override
      - "127.0.0.1::8025"
  otel-collector:
    ports: !reset []
  nacos:
    ports: !reset []
    environment:
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
  iam-service:
    image: ${SF_ACCEPTANCE_PROJECT:?SF_ACCEPTANCE_PROJECT is required}/iam-service:acceptance
    build: !reset null
    ports: !reset []
    group_add: ["${E2E_HOST_GID:?E2E_HOST_GID is required}"]
    environment:
      BROWSER_ROOT_DOMAIN: ${SF_ACCEPTANCE_ROOT_DOMAIN:-saasforge.test}
      PASSWORD_SETUP_PAGE_URI: https://console.${SF_ACCEPTANCE_ROOT_DOMAIN:-saasforge.test}/password-setup
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
  tenant-access-service:
    image: ${SF_ACCEPTANCE_PROJECT:?SF_ACCEPTANCE_PROJECT is required}/tenant-access-service:acceptance
    build: !reset null
    ports: !reset []
    group_add: ["${E2E_HOST_GID:?E2E_HOST_GID is required}"]
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
  entitlement-service:
    image: ${SF_ACCEPTANCE_PROJECT:?SF_ACCEPTANCE_PROJECT is required}/entitlement-service:acceptance
    build: !reset null
    ports: !reset []
    group_add: ["${E2E_HOST_GID:?E2E_HOST_GID is required}"]
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
  audit-service:
    image: ${SF_ACCEPTANCE_PROJECT:?SF_ACCEPTANCE_PROJECT is required}/audit-service:acceptance
    build: !reset null
    ports: !reset []
    environment:
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx128m
  gateway:
    image: ${SF_ACCEPTANCE_PROJECT:?SF_ACCEPTANCE_PROJECT is required}/gateway:acceptance
    build: !reset null
    ports: !reset []
    environment:
      BROWSER_ROOT_DOMAIN: ${SF_ACCEPTANCE_ROOT_DOMAIN:-saasforge.test}
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx192m
  iam-platform-admin-bootstrap:
    image: ${SF_ACCEPTANCE_PROJECT:?SF_ACCEPTANCE_PROJECT is required}/iam-service:acceptance
    build: !reset null
    group_add: ["${E2E_HOST_GID:?E2E_HOST_GID is required}"]
  iam-reserved-service-client-bootstrap:
    image: ${SF_ACCEPTANCE_PROJECT:?SF_ACCEPTANCE_PROJECT is required}/iam-service:acceptance
    build: !reset null
    group_add: ["${E2E_HOST_GID:?E2E_HOST_GID is required}"]
  platform-console:
    image: node:24.14.1-alpine
    # Linux bind mount 保留构建者权限；以该 UID 只读消费工件，不依赖 Docker Desktop 的权限映射。
    user: "${E2E_HOST_UID:?E2E_HOST_UID is required}:${E2E_HOST_GID:?E2E_HOST_GID is required}"
    read_only: true
    command: ["node", "/app/serve.mjs"]
    environment:
      SF_ACCEPTANCE_ROOT_DOMAIN: ${SF_ACCEPTANCE_ROOT_DOMAIN:-saasforge.test}
    volumes:
      - ./console-authentication/serve.mjs:/app/serve.mjs:ro
      - ../../consoles/platform-console/dist:/app/dist:ro
      - ../../consoles/integration-test/dist:/app/acceptance:ro
  tenant-console:
    image: node:24.14.1-alpine
    user: "${E2E_HOST_UID:?E2E_HOST_UID is required}:${E2E_HOST_GID:?E2E_HOST_GID is required}"
    read_only: true
    command: ["node", "/app/serve.mjs"]
    environment:
      SF_ACCEPTANCE_ROOT_DOMAIN: ${SF_ACCEPTANCE_ROOT_DOMAIN:-saasforge.test}
    volumes:
      - ./console-authentication/serve.mjs:/app/serve.mjs:ro
      - ../../consoles/tenant-console-shell/dist:/app/dist:ro
  console-tls:
    image: node:24.14.1-alpine
    user: node
    group_add: ["${E2E_HOST_GID:?E2E_HOST_GID is required}"]
    read_only: true
    command: ["node", "/app/serve.mjs"]
    environment:
      SF_CONSOLE_SERVICE: edge
      SF_ACCEPTANCE_ROOT_DOMAIN: ${SF_ACCEPTANCE_ROOT_DOMAIN:-saasforge.test}
    # running 不等于 ready；浏览器只能在静态工件、Gateway/IAM 与 TLS listener 都就绪后进入。
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const net = require('node:net');
          const listening = new Promise((resolve, reject) => {
            const socket = net.createConnection({host:'127.0.0.1',port:8443});
            socket.on('connect', () => {socket.destroy();resolve();});
            socket.on('error', reject);
          });
          Promise.all([listening, ...[
            'http://platform-console:8080/',
            'http://tenant-console:8080/',
            'http://gateway:8080/.well-known/jwks.json'
          ].map(async url => {
            const response = await fetch(url, {headers:{accept: url.includes('/.well-known/') ? 'application/json' : 'text/html'}});
            if (response.status !== 200) throw new Error('not ready');
            await response.arrayBuffer();
          })]).then(() => process.exit(0), () => process.exit(1));
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - "127.0.0.1:443:8443"
    depends_on:
      platform-console: { condition: service_started }
      tenant-console: { condition: service_started }
      gateway: { condition: service_started }
    volumes:
      - ./console-authentication/serve.mjs:/app/serve.mjs:ro
      - type: bind
        source: ${SF_ACCEPTANCE_TLS_CERT:?SF_ACCEPTANCE_TLS_CERT is required}
        target: /run/secrets/tls-cert.pem
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${SF_ACCEPTANCE_TLS_KEY:?SF_ACCEPTANCE_TLS_KEY is required}
        target: /run/secrets/tls-key.pem
        read_only: true
        bind: { create_host_path: false }
