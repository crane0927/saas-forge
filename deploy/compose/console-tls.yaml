services:
  console-tls:
    image: node:24.14.1-alpine
    # 与两个 Console 一致，以构建者身份读取 umask 077 生成的只读 Remote 制品。
    user: "${E2E_HOST_UID:?E2E_HOST_UID is required}:${E2E_HOST_GID:?E2E_HOST_GID is required}"
    read_only: true
    command: ["node", "/app/serve.mjs"]
    environment:
      SF_CONSOLE_SERVICE: edge
      SF_ACCEPTANCE_ROOT_DOMAIN: ${SF_ACCEPTANCE_ROOT_DOMAIN:-saas.forge.test}
      SF_REMOTE_STATIC_MODULE: /app/remote-static.mjs
      SF_REMOTE_STATIC_DIRECTORY: /app/remote-artifacts
    # running 不等于 ready；浏览器只能在静态工件、Gateway/IAM 与 TLS listener 都就绪后进入。
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const net = require('node:net');
          const listening = new Promise((resolve, reject) => {
            const socket = net.createConnection({host:'127.0.0.1',port:8443});
            socket.on('connect', () => {socket.destroy();resolve();});
            socket.on('error', reject);
          });
          Promise.all([listening, ...[
            'http://platform-console:8080/',
            'http://tenant-console:8080/',
            'http://iam-service:8080/actuator/health/readiness',
            'http://tenant-access-service:8080/actuator/health/readiness',
            'http://entitlement-service:8080/actuator/health/readiness',
            'http://audit-service:8080/actuator/health/readiness',
            // Gateway 未暴露 Actuator HTTP 端点；JWKS 200 同时证明 Gateway、IAM 服务发现和实际代理路径就绪。
            'http://gateway:8080/.well-known/jwks.json'
          ].map(async url => {
            const endpoint = new URL(url);
            try {
              const response = await fetch(url, {
                headers:{accept: url.includes('/.well-known/') || url.includes('/actuator/') ? 'application/json' : 'text/html'},
                signal: AbortSignal.timeout(8000),
              });
              if (response.status !== 200) {
                throw new Error('HTTP ' + response.status);
              }
              await response.arrayBuffer();
            } catch (error) {
              const code = error?.cause?.code ?? error?.name ?? 'unavailable';
              throw new Error('health ' + endpoint.hostname + endpoint.pathname + ': ' + code);
            }
          })]).then(
            () => process.exit(0),
            error => {
              console.error(error.message);
              process.exit(1);
            },
          );
      interval: 3s
      timeout: 10s
      retries: 80
    ports:
      - "127.0.0.1:443:8443"
    volumes:
      - ../docker/console-serve.mjs:/app/serve.mjs:ro
      - ./local-https-development/remote-static.mjs:/app/remote-static.mjs:ro
      - ./local-https-development/browser-security-evidence.mjs:/app/browser-security-evidence.mjs:ro
      - type: bind
        source: ../../consoles/dist/static-remote-acceptance
        target: /app/remote-artifacts
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${SF_ACCEPTANCE_TLS_CERT:?SF_ACCEPTANCE_TLS_CERT is required}
        target: /run/secrets/tls-cert.pem
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${SF_ACCEPTANCE_TLS_KEY:?SF_ACCEPTANCE_TLS_KEY is required}
        target: /run/secrets/tls-key.pem
        read_only: true
        bind: { create_host_path: false }
