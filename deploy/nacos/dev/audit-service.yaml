saasforge:
  audit:
    configuration-revision: "3"
    consumer:
      max-attempts: 10
      initial-backoff: PT1S
      max-backoff: PT1M
    isolation:
      publish-delay: PT1S
      lease-duration: PT30S

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,nacosRegistrationReadiness,auditRuntimeReadiness

spring:
  nacos:
    config:
      health-indicator:
        enabled: true
  cloud:
    nacos:
      discovery:
        health-indicator:
          enabled: true
    discovery:
      client:
        health-indicator:
          use-services-query: false
