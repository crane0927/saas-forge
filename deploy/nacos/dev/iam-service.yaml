saasforge:
  iam:
    configuration-revision: "2"

security:
  jwt:
    signing:
      adapter: pem-jca
      pem:
        key-version-ref: ${IAM_JWT_PEM_KEY_VERSION_REF:?IAM_JWT_PEM_KEY_VERSION_REF is required}
        private-key-location: ${IAM_JWT_PEM_PRIVATE_KEY_LOCATION:?IAM_JWT_PEM_PRIVATE_KEY_LOCATION is required}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,nacosRegistrationReadiness

spring:
  nacos:
    config:
      health-indicator:
        enabled: true
  cloud:
    nacos:
      discovery:
        health-indicator:
          enabled: true
    discovery:
      client:
        health-indicator:
          use-services-query: false
