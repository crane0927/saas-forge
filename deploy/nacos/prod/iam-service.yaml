saasforge:
  iam:
    configuration-revision: "5"
    outbox:
      publish-delay: PT1S
      lease-duration: PT30S
    tenant-context-switch:
      recovery-delay: PT1S
      lease-duration: PT30S
      initial-backoff: PT1S
      maximum-backoff: PT1M
      maximum-attempts: 10
    session-revocation:
      worker-delay: PT1S
      batch-size: 1
      lease-duration: PT30S
      retry-delay: PT1S
      maximum-attempts: 10

spring:
  grpc:
    client:
      channels:
        tenant-access:
          default-deadline: PT3S
          negotiation-type: tls
          ssl:
            enabled: true
            bundle: tenant-access-grpc-client
  nacos:
    config:
      health-indicator:
        enabled: true
  cloud:
    nacos:
      discovery:
        health-indicator:
          enabled: true
    discovery:
      client:
        health-indicator:
          use-services-query: false

security:
  jwt:
    issuer: ${IAM_JWT_ISSUER:?IAM_JWT_ISSUER is required}
    access-token-ttl: PT15M
    service-access-token-ttl: PT5M
    signing:
      adapter: external
  login-protection:
    failure-window: PT15M
    maximum-failures: 5
    lock-duration: PT15M
  revocation-index:
    recovery-delay: PT5S

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,nacosRegistrationReadiness
