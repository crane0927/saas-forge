saasforge:
  iam:
    configuration-revision: "2"

security:
  jwt:
    issuer: ${IAM_JWT_ISSUER:?IAM_JWT_ISSUER is required}
    access-token-ttl: PT15M
    signing:
      adapter: external
  login-protection:
    failure-window: PT15M
    maximum-failures: 5
    lock-duration: PT15M

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,nacosRegistrationReadiness

spring:
  nacos:
    config:
      health-indicator:
        enabled: true
  cloud:
    nacos:
      discovery:
        health-indicator:
          enabled: true
    discovery:
      client:
        health-indicator:
          use-services-query: false
