saasforge:
  iam:
    configuration-revision: "3"

spring:
  ssl:
    bundle:
      pem:
        tenant-access-grpc-client:
          keystore:
            certificate: ${IAM_GRPC_CLIENT_CERTIFICATE:?IAM_GRPC_CLIENT_CERTIFICATE is required}
            private-key: ${IAM_GRPC_CLIENT_PRIVATE_KEY:?IAM_GRPC_CLIENT_PRIVATE_KEY is required}
            verify-keys: true
          truststore:
            certificate: ${GRPC_CA_CERTIFICATE:?GRPC_CA_CERTIFICATE is required}
  grpc:
    client:
      channels:
        tenant-access:
          negotiation-type: tls
          ssl:
            enabled: true
            bundle: tenant-access-grpc-client
  nacos:
    config:
      health-indicator:
        enabled: true
  cloud:
    nacos:
      discovery:
        health-indicator:
          enabled: true
    discovery:
      client:
        health-indicator:
          use-services-query: false

security:
  jwt:
    issuer: ${IAM_JWT_ISSUER:?IAM_JWT_ISSUER is required}
    access-token-ttl: PT15M
    signing:
      adapter: external
  login-protection:
    failure-window: PT15M
    maximum-failures: 5
    lock-duration: PT15M

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,nacosRegistrationReadiness
