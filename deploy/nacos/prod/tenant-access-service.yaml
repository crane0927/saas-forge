saasforge:
  tenant-access:
    configuration-revision: "3"

spring:
  grpc:
    server:
      ssl:
        enabled: true
        bundle: tenant-access-grpc-server
        client-auth: require
  nacos:
    config:
      health-indicator:
        enabled: true
  cloud:
    nacos:
      discovery:
        health-indicator:
          enabled: true
    discovery:
      client:
        health-indicator:
          use-services-query: false

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,nacosRegistrationReadiness
