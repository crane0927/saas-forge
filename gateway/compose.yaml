name: saas-forge-gateway
services:
  gateway:
    image: saas.forge/gateway:local
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        MODULE: gateway
    environment:
      SAASFORGE_SECRETS_IMPORT: ""
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ""
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      IAM_JWT_ISSUER: ${IAM_JWT_ISSUER:?IAM_JWT_ISSUER is required}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: dev
      NACOS_TLS_ENABLED: "false"
      NACOS_GATEWAY_USERNAME: ${NACOS_GATEWAY_USERNAME:?NACOS_GATEWAY_USERNAME is required}
      NACOS_GATEWAY_PASSWORD: ${NACOS_GATEWAY_PASSWORD:?NACOS_GATEWAY_PASSWORD is required}
    ports:
      - "127.0.0.1:8080:8080"

networks:
  default:
    external: true
    name: ${SF_DOCKER_NETWORK:-compose_default}
