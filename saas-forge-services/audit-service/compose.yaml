name: saas-forge-audit-service
services:
  audit-migrate:
    image: flyway/flyway:12
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/audit_db
      FLYWAY_USER: audit_migrator
      FLYWAY_PASSWORD: ${AUDIT_MIGRATOR_PASSWORD:?AUDIT_MIGRATOR_PASSWORD is required}
      FLYWAY_CONNECT_RETRIES: 30
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    command: migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro

  audit-service:
    image: saas.forge/audit-service:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        MODULE: saas-forge-services/audit-service
    depends_on:
      audit-migrate:
        condition: service_completed_successfully
    environment:
      SAASFORGE_SECRETS_IMPORT: ""
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ""
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: dev
      NACOS_TLS_ENABLED: "false"
      NACOS_AUDIT_USERNAME: ${NACOS_AUDIT_USERNAME:?NACOS_AUDIT_USERNAME is required}
      NACOS_AUDIT_PASSWORD: ${NACOS_AUDIT_PASSWORD:?NACOS_AUDIT_PASSWORD is required}
      AUDIT_DATABASE_URL: jdbc:postgresql://postgres:5432/audit_db
      AUDIT_DATABASE_USERNAME: audit_app
      AUDIT_DATABASE_PASSWORD: ${AUDIT_APP_PASSWORD:?AUDIT_APP_PASSWORD is required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:8084:8080"

  audit-isolation-replay:
    profiles: ["audit-isolation-replay"]
    image: saas.forge/audit-service:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        MODULE: saas-forge-services/audit-service
    depends_on:
      audit-migrate:
        condition: service_completed_successfully
    entrypoint:
      - java
      - -Dloader.main=io.saas.forge.auditreplay.AuditIsolationReplayApplication
      - -cp
      - /app/application.jar
      - org.springframework.boot.loader.launch.PropertiesLauncher
    command:
      - --saas.forge.audit.replay.isolation-id=${AUDIT_ISOLATION_REPLAY_ID:-}
    environment:
      AUDIT_DATABASE_URL: jdbc:postgresql://postgres:5432/audit_db
      AUDIT_DATABASE_USERNAME: audit_app
      AUDIT_DATABASE_PASSWORD: ${AUDIT_APP_PASSWORD:?AUDIT_APP_PASSWORD is required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092


networks:
  default:
    external: true
    name: ${SF_DOCKER_NETWORK:-compose_default}
