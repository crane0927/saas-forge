name: saas-forge-iam-service
services:
  iam-migrate:
    image: flyway/flyway:12
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/iam_db
      FLYWAY_USER: iam_migrator
      FLYWAY_PASSWORD: ${IAM_MIGRATOR_PASSWORD:?IAM_MIGRATOR_PASSWORD is required}
      FLYWAY_CONNECT_RETRIES: 30
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    command: migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro

  iam-platform-admin-bootstrap:
    profiles: ["bootstrap"]
    image: saas.forge/iam-service:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        MODULE: saas-forge-services/iam-service
    depends_on:
      iam-migrate:
        condition: service_completed_successfully
    entrypoint:
      - java
      - -Dloader.main=io.saas.forge.iambootstrap.PlatformAdminBootstrapApplication
      - -jar
      - /app/application.jar
    command:
      - --saas.forge.iam.bootstrap.platform-admin.email-file=/run/secrets/platform-admin-email
      - --saas.forge.iam.bootstrap.platform-admin.password-file=/run/secrets/platform-admin-password
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iam_db
      SPRING_DATASOURCE_USERNAME: iam_app
      SPRING_DATASOURCE_PASSWORD: ${IAM_APP_PASSWORD:?IAM_APP_PASSWORD is required}
      SAASFORGE_ENVIRONMENT: dev
    volumes:
      - type: bind
        source: ${IAM_PLATFORM_ADMIN_EMAIL_FILE:-../../deploy/compose/.secrets/platform-admin-email}
        target: /run/secrets/platform-admin-email
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${IAM_PLATFORM_ADMIN_PASSWORD_FILE:-../../deploy/compose/.secrets/platform-admin-password}
        target: /run/secrets/platform-admin-password
        read_only: true
        bind:
          create_host_path: false

  iam-platform-admin-credential-reset:
    profiles: ["credential-reset"]
    image: saas.forge/iam-service:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        MODULE: saas-forge-services/iam-service
    depends_on:
      iam-migrate:
        condition: service_completed_successfully
    entrypoint:
      - java
      - -Dloader.main=io.saas.forge.iambootstrap.PlatformAdminCredentialResetApplication
      - -jar
      - /app/application.jar
    command:
      - --saas.forge.iam.bootstrap.platform-admin-reset.request-id-file=/run/secrets/platform-admin-reset-request-id
      - --saas.forge.iam.bootstrap.platform-admin-reset.password-file=/run/secrets/platform-admin-reset-password
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iam_db
      SPRING_DATASOURCE_USERNAME: iam_app
      SPRING_DATASOURCE_PASSWORD: ${IAM_APP_PASSWORD:?IAM_APP_PASSWORD is required}
      SAASFORGE_ENVIRONMENT: dev
    volumes:
      - type: bind
        source: ${IAM_PLATFORM_ADMIN_RESET_REQUEST_ID_FILE:-../../deploy/compose/.secrets/platform-admin-reset-request-id}
        target: /run/secrets/platform-admin-reset-request-id
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${IAM_PLATFORM_ADMIN_RESET_PASSWORD_FILE:-../../deploy/compose/.secrets/platform-admin-reset-password}
        target: /run/secrets/platform-admin-reset-password
        read_only: true
        bind:
          create_host_path: false

  iam-reserved-service-client-bootstrap:
    profiles: ["service-client-bootstrap"]
    image: saas.forge/iam-service:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        MODULE: saas-forge-services/iam-service
    depends_on:
      iam-migrate:
        condition: service_completed_successfully
    entrypoint:
      - java
      - -Dloader.main=io.saas.forge.iambootstrap.ReservedServiceClientBootstrapApplication
      - -jar
      - /app/application.jar
    command:
      - --saas.forge.iam.bootstrap.service-clients.iam.id-file=/run/secrets/iam-client-id
      - --saas.forge.iam.bootstrap.service-clients.iam.secret-file=/run/secrets/iam-client-secret
      - --saas.forge.iam.bootstrap.service-clients.tenant-access.id-file=/run/secrets/tenant-access-client-id
      - --saas.forge.iam.bootstrap.service-clients.tenant-access.secret-file=/run/secrets/tenant-access-client-secret
      - --saas.forge.iam.bootstrap.service-clients.entitlement.id-file=/run/secrets/entitlement-client-id
      - --saas.forge.iam.bootstrap.service-clients.entitlement.secret-file=/run/secrets/entitlement-client-secret
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iam_db
      SPRING_DATASOURCE_USERNAME: iam_app
      SPRING_DATASOURCE_PASSWORD: ${IAM_APP_PASSWORD:?IAM_APP_PASSWORD is required}
    volumes:
      - type: bind
        source: ${IAM_SERVICE_CLIENT_ID_FILE:-../../deploy/compose/.secrets/iam-client-id}
        target: /run/secrets/iam-client-id
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${IAM_SERVICE_CLIENT_SECRET_FILE:-../../deploy/compose/.secrets/iam-client-secret}
        target: /run/secrets/iam-client-secret
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${TENANT_ACCESS_SERVICE_CLIENT_ID_FILE:-../../deploy/compose/.secrets/tenant-access-client-id}
        target: /run/secrets/tenant-access-client-id
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${TENANT_ACCESS_SERVICE_CLIENT_SECRET_FILE:-../../deploy/compose/.secrets/tenant-access-client-secret}
        target: /run/secrets/tenant-access-client-secret
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${ENTITLEMENT_SERVICE_CLIENT_ID_FILE:-../../deploy/compose/.secrets/entitlement-client-id}
        target: /run/secrets/entitlement-client-id
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${ENTITLEMENT_SERVICE_CLIENT_SECRET_FILE:-../../deploy/compose/.secrets/entitlement-client-secret}
        target: /run/secrets/entitlement-client-secret
        read_only: true
        bind: { create_host_path: false }

  iam-reserved-service-client-replacement:
    profiles: ["service-client-replacement"]
    image: saas.forge/iam-service:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        MODULE: saas-forge-services/iam-service
    depends_on:
      iam-migrate:
        condition: service_completed_successfully
    entrypoint:
      - java
      - -Dloader.main=io.saas.forge.iambootstrap.ReservedServiceClientReplacementApplication
      - -jar
      - /app/application.jar
    command:
      - --saas.forge.iam.replacement.reserved-client.replacement-request-id=${IAM_RESERVED_CLIENT_REPLACEMENT_REQUEST_ID:-}
      - --saas.forge.iam.replacement.reserved-client.service-key=${IAM_RESERVED_CLIENT_REPLACEMENT_SERVICE_KEY:-}
      - --saas.forge.iam.replacement.reserved-client.old-client-id=${IAM_RESERVED_CLIENT_REPLACEMENT_OLD_CLIENT_ID:-}
      - --saas.forge.iam.replacement.reserved-client.new-client-id=${IAM_RESERVED_CLIENT_REPLACEMENT_NEW_CLIENT_ID:-}
      - --saas.forge.iam.replacement.reserved-client.new-secret-file=/run/secrets/replacement-client-secret
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iam_db
      SPRING_DATASOURCE_USERNAME: iam_app
      SPRING_DATASOURCE_PASSWORD: ${IAM_APP_PASSWORD:?IAM_APP_PASSWORD is required}
      SAASFORGE_ENVIRONMENT: dev
    volumes:
      - type: bind
        source: ${IAM_RESERVED_CLIENT_REPLACEMENT_SECRET_FILE:-../../deploy/compose/.secrets/replacement-client-secret}
        target: /run/secrets/replacement-client-secret
        read_only: true
        bind: { create_host_path: false }

  iam-service:
    image: saas.forge/iam-service:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        MODULE: saas-forge-services/iam-service
    depends_on:
      iam-migrate:
        condition: service_completed_successfully
    environment:
      SAASFORGE_SECRETS_IMPORT: ""
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ""
      SPRING_GRPC_SERVER_PORT: 9090
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iam_db
      SPRING_DATASOURCE_USERNAME: iam_app
      SPRING_DATASOURCE_PASSWORD: ${IAM_APP_PASSWORD:?IAM_APP_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      BROWSER_ROOT_DOMAIN: saas.forge.test
      IAM_JWT_ISSUER: ${IAM_JWT_ISSUER:?IAM_JWT_ISSUER is required}
      IAM_JWT_PEM_KEY_VERSION_REF: ${IAM_JWT_PEM_KEY_VERSION_REF:?IAM_JWT_PEM_KEY_VERSION_REF is required}
      IAM_JWT_PEM_PRIVATE_KEY_LOCATION: file:/run/secrets/iam-jwt-private-key.pem
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: dev
      NACOS_TLS_ENABLED: "false"
      NACOS_IAM_USERNAME: ${NACOS_IAM_USERNAME:?NACOS_IAM_USERNAME is required}
      NACOS_IAM_PASSWORD: ${NACOS_IAM_PASSWORD:?NACOS_IAM_PASSWORD is required}
      SAASFORGE_SERVICE_CLIENT_ID_FILE: /run/secrets/service-client-id
      SAASFORGE_SERVICE_CLIENT_SECRET_FILE: /run/secrets/service-client-secret
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@saas.forge.test
      PASSWORD_SETUP_PAGE_URI: https://console.saas.forge.test/password-setup
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:9091:9090"
    volumes:
      - ${IAM_JWT_PEM_PRIVATE_KEY_FILE:?IAM_JWT_PEM_PRIVATE_KEY_FILE is required}:/run/secrets/iam-jwt-private-key.pem:ro
      - type: bind
        source: ${IAM_SERVICE_CLIENT_ID_FILE:-../../deploy/compose/.secrets/iam-client-id}
        target: /run/secrets/service-client-id
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${IAM_SERVICE_CLIENT_SECRET_FILE:-../../deploy/compose/.secrets/iam-client-secret}
        target: /run/secrets/service-client-secret
        read_only: true
        bind: { create_host_path: false }


networks:
  default:
    external: true
    name: ${SF_DOCKER_NETWORK:-compose_default}
