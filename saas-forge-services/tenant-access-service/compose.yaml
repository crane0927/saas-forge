name: saas-forge-tenant-access-service
services:
  tenant-access-migrate:
    image: flyway/flyway:12
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/tenant_access_db
      FLYWAY_USER: tenant_access_migrator
      FLYWAY_PASSWORD: ${TENANT_ACCESS_MIGRATOR_PASSWORD:?TENANT_ACCESS_MIGRATOR_PASSWORD is required}
      FLYWAY_CONNECT_RETRIES: 30
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    command: migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro

  tenant-access-service:
    image: saas.forge/tenant-access-service:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        MODULE: saas-forge-services/tenant-access-service
    depends_on:
      tenant-access-migrate:
        condition: service_completed_successfully
    environment:
      SAASFORGE_SECRETS_IMPORT: ""
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ""
      SPRING_GRPC_SERVER_PORT: 9090
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tenant_access_db
      SPRING_DATASOURCE_USERNAME: tenant_access_app
      SPRING_DATASOURCE_PASSWORD: ${TENANT_ACCESS_APP_PASSWORD:?TENANT_ACCESS_APP_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      IAM_JWT_ISSUER: ${IAM_JWT_ISSUER:?IAM_JWT_ISSUER is required}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: dev
      NACOS_TLS_ENABLED: "false"
      NACOS_TENANT_ACCESS_USERNAME: ${NACOS_TENANT_ACCESS_USERNAME:?NACOS_TENANT_ACCESS_USERNAME is required}
      NACOS_TENANT_ACCESS_PASSWORD: ${NACOS_TENANT_ACCESS_PASSWORD:?NACOS_TENANT_ACCESS_PASSWORD is required}
      SAASFORGE_SERVICE_CLIENT_ID_FILE: /run/secrets/service-client-id
      SAASFORGE_SERVICE_CLIENT_SECRET_FILE: /run/secrets/service-client-secret
      IAM_SERVICE_CLIENT_ID_FILE: /run/secrets/iam-service-client-id
    ports:
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:9092:9090"
    volumes:
      - type: bind
        source: ${TENANT_ACCESS_SERVICE_CLIENT_ID_FILE:-../../deploy/compose/.secrets/tenant-access-client-id}
        target: /run/secrets/service-client-id
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${TENANT_ACCESS_SERVICE_CLIENT_SECRET_FILE:-../../deploy/compose/.secrets/tenant-access-client-secret}
        target: /run/secrets/service-client-secret
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${IAM_SERVICE_CLIENT_ID_FILE:-../../deploy/compose/.secrets/iam-client-id}
        target: /run/secrets/iam-service-client-id
        read_only: true
        bind: { create_host_path: false }


networks:
  default:
    external: true
    name: ${SF_DOCKER_NETWORK:-compose_default}
