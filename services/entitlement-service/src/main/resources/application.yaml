spring:
  application:
    name: entitlement-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  config:
    import: nacos:entitlement-service.yaml?group=SAAS_FORGE&refreshEnabled=false
  cloud:
    nacos:
      username: ${NACOS_ENTITLEMENT_USERNAME:?NACOS_ENTITLEMENT_USERNAME is required}
      password: ${NACOS_ENTITLEMENT_PASSWORD:?NACOS_ENTITLEMENT_PASSWORD is required}
      config:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        ssl:
          enabled: ${NACOS_TLS_ENABLED:false}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        service: entitlement-service
        fail-fast: true
  flyway:
    enabled: false
  grpc:
    client:
      channels:
        iam:
          address: ${IAM_GRPC_ADDRESS:static://iam-service:9090}
          default-deadline: PT3S
        tenant-access:
          address: ${TENANT_ACCESS_GRPC_ADDRESS:static://tenant-access-service:9090}
          default-deadline: PT3S

security:
  jwt:
    issuer: ${IAM_JWT_ISSUER:?IAM_JWT_ISSUER is required}

saasforge:
  environment: ${SAASFORGE_ENVIRONMENT:dev}
  entitlement:
    iam-http-base-url: ${IAM_HTTP_BASE_URL:http://iam-service:8080}
    service-client-id-file: ${SAASFORGE_SERVICE_CLIENT_ID_FILE:?SAASFORGE_SERVICE_CLIENT_ID_FILE is required}
    service-client-secret-file: ${SAASFORGE_SERVICE_CLIENT_SECRET_FILE:?SAASFORGE_SERVICE_CLIENT_SECRET_FILE is required}
    outbox-topic: saasforge.${saasforge.environment}.entitlement-service.events

mybatis:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-handlers-package: io.saasforge.entitlement.infrastructure.persistence.type
