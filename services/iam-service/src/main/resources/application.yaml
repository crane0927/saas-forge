spring:
  application:
    name: iam-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  config:
    import: nacos:iam-service.yaml?group=SAAS_FORGE&refreshEnabled=false
  cloud:
    nacos:
      username: ${NACOS_IAM_USERNAME:?NACOS_IAM_USERNAME is required}
      password: ${NACOS_IAM_PASSWORD:?NACOS_IAM_PASSWORD is required}
      config:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        ssl:
          enabled: ${NACOS_TLS_ENABLED:false}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        service: iam-service
        fail-fast: true
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  grpc:
    client:
      channels:
        tenant-access:
          address: ${TENANT_ACCESS_GRPC_ADDRESS:static://tenant-access-service:9090}
          default-deadline: PT3S

security:
  jwt:
    issuer: ${IAM_JWT_ISSUER:?IAM_JWT_ISSUER is required}
    access-token-ttl: PT15M
    service-access-token-ttl: PT5M
  login-protection:
    failure-window: PT15M
    maximum-failures: 5
    lock-duration: PT15M
  revocation-index:
    recovery-delay: PT5S

saasforge:
  environment: ${SAASFORGE_ENVIRONMENT:dev}
  iam:
    tenant-access-grpc-target: tenant-access
    password-setup:
      page-uri: ${PASSWORD_SETUP_PAGE_URI:}
      smtp:
        host: ${SMTP_HOST:}
        port: ${SMTP_PORT:1025}
        username: ${SMTP_USERNAME:}
        password: ${SMTP_PASSWORD:}
        from: ${SMTP_FROM:}
        starttls: ${SMTP_STARTTLS:false}
        timeout: ${SMTP_TIMEOUT:PT5S}
    outbox:
      publish-delay: PT1S
      lease-duration: PT30S

mybatis:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-handlers-package: io.saasforge.iam.infrastructure.persistence.type
