spring:
  application:
    name: iam-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  cloud:
    nacos:
      username: ${NACOS_IAM_USERNAME:?NACOS_IAM_USERNAME is required}
      password: ${NACOS_IAM_PASSWORD:?NACOS_IAM_PASSWORD is required}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        ssl:
          enabled: ${NACOS_TLS_ENABLED:false}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        service: iam-service
        metadata:
          grpc.port: ${spring.grpc.server.port}
        fail-fast: true
        enabled: true
        ip: ${IAM_REGISTER_IP:127.0.0.1}
        port: ${server.port}
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  grpc:
    client:
      channels:
        tenant-access:
          default-deadline: PT3S
    server:
      port: ${IAM_GRPC_PORT:9091}
  config:
    import: ${SAASFORGE_SECRETS_IMPORT:configtree:./deploy/compose/.secrets/native-local/iam/}
  datasource:
    url: ${IAM_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/iam_db}
    username: ${IAM_DATASOURCE_USERNAME:iam_app}
    password: ${IAM_APP_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
browser:
  rootDomain: ${BROWSER_ROOT_DOMAIN:saasforge.test}
saasforge:
  environment: ${SAASFORGE_ENVIRONMENT:dev}
  iam:
    service-client-id-file: ${SAASFORGE_SERVICE_CLIENT_ID_FILE:?SAASFORGE_SERVICE_CLIENT_ID_FILE is required}
    service-client-secret-file: ${SAASFORGE_SERVICE_CLIENT_SECRET_FILE:?SAASFORGE_SERVICE_CLIENT_SECRET_FILE is required}
    password-setup:
      page-uri: ${PASSWORD_SETUP_PAGE_URI:}
      smtp:
        host: ${SMTP_HOST:}
        port: ${SMTP_PORT:1025}
        username: ${SMTP_USERNAME:}
        password: ${SMTP_PASSWORD:}
        from: ${SMTP_FROM:}
        starttls: ${SMTP_STARTTLS:false}
        timeout: ${SMTP_TIMEOUT:PT5S}
mybatis:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-handlers-package: io.saasforge.iam.infrastructure.persistence.type
server:
  address: ${IAM_BIND_ADDRESS:127.0.0.1}
  port: ${IAM_HTTP_PORT:8081}

---
spring:
  config:
    activate:
      on-profile: "!local-file"
    import: nacos:iam-service.yaml?group=SAAS_FORGE&refreshEnabled=false
