spring:
  application:
    name: tenant-access-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  config:
    import: nacos:tenant-access-service.yaml?group=SAAS_FORGE&refreshEnabled=false
  cloud:
    nacos:
      username: ${NACOS_TENANT_ACCESS_USERNAME:?NACOS_TENANT_ACCESS_USERNAME is required}
      password: ${NACOS_TENANT_ACCESS_PASSWORD:?NACOS_TENANT_ACCESS_PASSWORD is required}
      config:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        ssl:
          enabled: ${NACOS_TLS_ENABLED:false}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        service: tenant-access-service
        fail-fast: true
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  grpc:
    client:
      channels:
        iam:
          address: ${IAM_GRPC_ADDRESS:static://iam-service:9090}
          default-deadline: PT3S
        entitlement:
          address: ${ENTITLEMENT_GRPC_ADDRESS:static://entitlement-service:9090}
          default-deadline: PT3S

security:
  jwt:
    issuer: ${IAM_JWT_ISSUER:?IAM_JWT_ISSUER is required}

saasforge:
  environment: ${SAASFORGE_ENVIRONMENT:dev}
  tenant-access:
    iam-http-base-url: ${IAM_HTTP_BASE_URL:http://iam-service:8080}
    service-client-id-file: ${SAASFORGE_SERVICE_CLIENT_ID_FILE:?SAASFORGE_SERVICE_CLIENT_ID_FILE is required}
    service-client-secret-file: ${SAASFORGE_SERVICE_CLIENT_SECRET_FILE:?SAASFORGE_SERVICE_CLIENT_SECRET_FILE is required}
    outbox-topic: saasforge.${saasforge.environment}.tenant-access-service.events
    outbox:
      publish-delay: PT1S
      lease-duration: PT30S
    initialization:
      recovery-delay: PT1S
      lease-duration: PT30S
      initial-backoff: PT1S
      maximum-backoff: PT1M
      maximum-attempts: 10
    password-setup:
      recovery-delay: PT1S

mybatis:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-handlers-package: io.saasforge.tenantaccess.infrastructure.persistence.type
